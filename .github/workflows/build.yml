name: Build CrystalDust

on:
  push:
    branches: [ "progrees" ]
  pull_request:
    branches: [ "progrees" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev pkg-config git curl bzip2 automake autoconf libtool

      - name: Compile Repository Tools and agbcc
        run: |
          make tools
          if [ -d "tools/agbcc" ]; then
            cd tools/agbcc
            ./build.sh
            ./install.sh
            cd ../..
          fi

      - name: Setup agbcc Paths
        run: |
          echo "AGBCC=$PWD/tools/agbcc" >> $GITHUB_PATH
          echo "PATH=$PWD/tools/agbcc:$PATH" >> $GITHUB_ENV

      - name: Build ROM
        run: |
          make -j$(nproc)

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: CrystalDust.gba